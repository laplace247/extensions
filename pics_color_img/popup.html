<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <link rel="stylesheet" href="popup.css">
    <title>Image Color Picker</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Color Picker</h1>
            <button id="theme-toggle" class="theme-btn">
                <i class="fi fi-br-sun"></i>
            </button>
        </div>
        <div class="img-section">
            <img src="https://i.postimg.cc/pdtSSY2d/bg.jpg" id="image">
        </div>
        <div class="btns-container">
            <input type="file" id="file" accept="image/*">
            <label for="file">Abrir una foto</label>
            <button id="pick-btn">Elegir color</button>
        </div>
        <div id="result" class="hide">
            <div>
                <input type="text" id="hex-input" readonly>
                <button onclick="copyToClipboard('hex-input')">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>
            <div>
                <input type="text" id="rgb-input" readonly>
                <button onclick="copyToClipboard('rgb-input')">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>
            <div id="picked-color"></div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
